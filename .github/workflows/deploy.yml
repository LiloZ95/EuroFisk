name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by the CMS when the owner saves a change, so edits reach the live site
  # without anyone touching the repo. See docs/CMS-SETUP.md.
  repository_dispatch:
    types: [cms-update]

# Permissions the deploy step needs to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only run one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          DEPLOY_TARGET: gh-pages
          # Where to pull the owner's content from. Set under
          # Settings → Secrets and variables → Actions → Variables.
          CMS_URL: ${{ vars.CMS_URL }}
          # Once the CMS is live, a failed fetch should fail the deploy rather than
          # silently shipping stale content. Leave unset until then.
          REQUIRE_CMS: ${{ vars.REQUIRE_CMS }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
