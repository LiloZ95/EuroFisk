name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by the CMS when the owner saves a change, so edits reach the live site
  # without anyone touching the repo. See docs/CMS-SETUP.md.
  repository_dispatch:
    types: [cms-update]

# Permissions the deploy step needs to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A newer save supersedes an older one: the build reads the whole CMS state fresh, so
    # the latest run already contains every earlier edit. Superseded builds are therefore
    # pure waste and safe to cancel — ten saves in a row collapse to one published build.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          DEPLOY_TARGET: gh-pages
          # Where to pull the owner's content from. Set under
          # Settings → Secrets and variables → Actions → Variables.
          CMS_URL: ${{ vars.CMS_URL }}
          # Set to 1, so a failed fetch fails the deploy instead of silently publishing
          # the stale content.json committed in the repo.
          REQUIRE_CMS: ${{ vars.REQUIRE_CMS }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Publishing is the one thing that must not be interrupted — cancelling deploy-pages
    # partway is how a Pages site ends up half-updated. Later deploys queue behind this
    # one instead of killing it.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
