
  <!DOCTYPE html>
  <html lang="sv">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>EuroFisk Malmö | Rosengård & Östra Sorgenfri</title>
      <meta name="description" content="EuroFisk serverar färsk, grillad och friterad fisk i Rosengård och Östra Sorgenfri, Malmö. Välj plats, se rätt meny och beställ via WhatsApp." />
      <meta name="robots" content="index, follow" />
      <!-- Generated from the logo by scripts/make-favicons.py -->
      <link rel="icon" href="/favicon.ico" sizes="32x32" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <meta name="theme-color" content="#0D1F3C" />
      <meta name="referrer" content="strict-origin-when-cross-origin" />
      <meta property="og:type" content="website" />
      <meta property="og:locale" content="sv_SE" />
      <meta property="og:title" content="EuroFisk Malmö | Rosengård & Östra Sorgenfri" />
      <meta property="og:description" content="Färsk fisk och skaldjur på två platser i Malmö. Välj Rosengård eller Östra Sorgenfri och se rätt meny." />
      <!--
        Photos and the hero video are served from Cloudflare R2, so img-src and media-src
        have to name that origin — 'self' alone blocks every one of them. Both the current
        r2.dev bucket URL and the custom domain are listed so binding media.eurofisk.se
        does not black out the site again; drop the r2.dev entry once that switch is done.
      -->
      <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://pub-27ebb0d7e34a4e2cbbd3473981092938.r2.dev https://media.eurofisk.se; media-src 'self' https://pub-27ebb0d7e34a4e2cbbd3473981092938.r2.dev https://media.eurofisk.se; connect-src 'self'; form-action 'self';"
      />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <!-- Weight 300 is never used (no font-light anywhere); 400/500/600/700 are. -->
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;500;600;700&family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap"
      />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
